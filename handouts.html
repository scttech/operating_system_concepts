<body data-root="" data-page="handouts">
<main class="narrow">
  <h1 class="no-print">Printable handouts</h1>
  <p class="lead no-print">Sheets made for paper: a study guide, a quiz worksheet with a separate answer key, and a glossary. Choose what to include, then press Print (or save as PDF from the print dialog). The <a href="cheatsheet.html">cheat sheet</a> is laid out for printing too.</p>

  <form id="setup" class="exam-setup no-print">
    <fieldset>
      <legend>Which sheet?</legend>
      <label class="pick"><input type="radio" name="kind" value="guide" checked> <b>Study guide</b>: what to be able to do, and the ideas to remember, for each module</label>
      <label class="pick"><input type="radio" name="kind" value="worksheet"> <b>Worksheet</b>: quiz questions with choices and no answers</label>
      <label class="pick"><input type="radio" name="kind" value="key"> <b>Answer key</b>: the matching answers and explanations (print it separately for the teacher)</label>
      <label class="pick"><input type="radio" name="kind" value="glossary"> <b>Glossary</b>: every term, by topic</label>
    </fieldset>
    <fieldset id="mod-set">
      <legend>Which modules?</legend>
      <div class="row"><button class="btn secondary" id="all" type="button">Select all</button><button class="btn secondary" id="none" type="button">Select none</button></div>
      <div id="modules"></div>
    </fieldset>
    <div class="controls">
      <label id="count-label"><span>Questions per module</span><select id="count"><option value="3">3</option><option value="5" selected>5</option><option value="0">All of them</option></select></label>
      <button class="btn" id="print" type="button">Print this sheet</button>
    </div>
    <p id="setup-msg" class="status-bad" role="alert"></p>
  </form>

  <section id="sheet" class="sheet" aria-label="Sheet preview"></section>
</main>
