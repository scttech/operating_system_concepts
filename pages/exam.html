<body data-root="../" data-page="exam">
<main class="narrow">
  <h1>Exam mode</h1>
  <p class="lead">A practice exam under test conditions: questions and choices are shuffled, the clock runs, and <b>no answers are shown until you submit</b>. Afterwards you see your score by module and review every question you missed. (To learn as you go, use <a href="practice.html">the quiz</a> instead.)</p>

  <form id="setup" class="exam-setup">
    <fieldset>
      <legend>Which modules?</legend>
      <div class="row"><button class="btn secondary" id="all" type="button">Select all</button><button class="btn secondary" id="none" type="button">Select none</button></div>
      <div id="modules"></div>
    </fieldset>
    <div class="controls">
      <label><span>Questions</span><select id="count"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option></select></label>
      <label><span>Time limit</span><select id="time"><option value="1" selected>Standard (about 75 seconds a question)</option><option value="2">Relaxed (twice as long)</option><option value="0">No time limit</option></select></label>
      <button class="btn" id="start" type="submit">Start the exam</button>
    </div>
    <p id="setup-msg" class="status-bad" role="alert"></p>
  </form>

  <section id="exam" hidden>
    <div class="exam-bar" id="exam-bar">
      <span id="clock" role="timer" aria-label="Time left"></span>
      <span id="answered" class="small"></span>
      <button class="btn" id="submit" type="button">Submit exam</button>
    </div>
    <p id="alerts" class="sr-only" aria-live="polite"></p>
    <div id="questions"></div>
    <div class="row"><button class="btn" id="submit2" type="button">Submit exam</button></div>
  </section>

  <section id="results" hidden aria-live="polite"></section>
</main>
